document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, up: true },\n  { name: \"Cybersecurity Analysts\", family: \"Technology · Security\", demand: \"44.8k posts\", median: \"$127k\", supply: \"Very tight\", trend: \"+21%\", up: true },\n];\n\nconst FAMILIES = [\"All\", \"Technology\", \"Design\", \"Healthcare\", \"Business\"];\n\nconst SAMPLE_JD = \"We are working with a large, complex public-sector organisation that is undertaking an ambitious programme of organisation-wide modernisation and service transformation.\\n\\nOver recent months, the organisation has invested significantly in building its transformation capability, bringing together Project Managers, Business Analysts, Service Designers and other specialist resources. Considerable work has also been undertaken to understand where services need to transform and the opportunities for improvement.\\n\\nThe next challenge is to bring structure, sequencing and experienced transformation leadership across this activity.\\n\\nWe are therefore looking for an experienced Programme Manager / Transformation Leader who has personally led complex, end-to-end service redesign within a large public-sector environment.\\n\\nThe Role\\nThis is not a conventional Programme Manager role just focused primarily on governance, reporting and coordinating project plans.\\n\\nThe successful individual will sit above a multidisciplinary transformation team and provide the structure, direction and delivery discipline required to move complex service redesign initiatives successfully from discovery and design through to implementation.\\n\\nThe organisation has already developed a transformation methodology and supporting framework, heavily influenced by GDS principles and ways of working. The requirement now is for someone with the experience and credibility to embed that approach across the programme and ensure teams consistently follow it.\\n\\nFundamentally, you will bring structure and chronology to transformation.\\n\\nYou will establish what needs to happen, in what sequence, who needs to be involved and what needs to be achieved before a service or workstream progresses to its next stage.\\n\\nIt is important to explain that the transformation extends well beyond technology. It considers the whole service operating model, including people, processes, organisational structure, technology, data, finance and the customer journey.\\n\\nKey Responsibilities\\n· Provide overall programme leadership across a portfolio of complex service redesign and modernisation activity.\\n· Establish the structure, sequencing and delivery rhythm required to move services through end-to-end transformation.\\n· Translate an established transformation methodology into a practical programme approach that teams can consistently execute.\\n· Provide clear direction to Project Managers, Business Analysts, Service Designers and other specialists regarding their responsibilities and deliverables at each stage.\\n· Coordinate transformation activity across operations, technology, process, organisational design, HR, finance and data.\\n· Ensure discovery, analysis, service design, business case development, implementation and benefits realisation happen in a logical and disciplined sequence.\\n· Identify and manage dependencies between services and workstreams.\\n· Bring consistency and rigour to programme planning, governance, risks, issues and decision-making.\\n· Challenge activity that is disconnected from the overall transformation outcome or taking place at the wrong point in the redesign lifecycle.\\n· Ensure transformation moves beyond analysis and design into executable, sustainable organisational change.\\n· Provide leadership, coaching and direction to the wider transformation team.\\n\\nAbout You:\\nThe need is there now so we are particularly interested in speaking with people who have genuinely done this before, rather than those whose experience has centered predominantly on traditional programme governance or technology implementation.\\n\\nWe are needing you to bring:\\n· Significant Programme Management or Transformation leadership experience within Local Government, Central Government or the wider Civil Service.\\n· Demonstrable experience of personally leading end-to-end service redesign and transformation.\\n· Experience redesigning services across the combination of people, process, technology, data and organisational structure.\\n· Strong knowledge of GDS methodologies, principles and service design approaches.\\n· Experience directing multidisciplinary teams incorporating Project Management, Business Analysis, Service Design and specialist corporate functions.\\n· The ability to take a transformation methodology and convert it into a clear, practical and sequenced programme of activity.\\n· Strong understanding of programme dependencies, governance, implementation and benefits realisation.\\n· Experience operating within a large organisation with significant organisational and stakeholder complexity.\\n· The credibility to provide direction to experienced transformation professionals while also constructively challenging senior stakeholders.\\n\\nEnd-User Transformation Experience\\nThere is a strong preference for candidates who have worked directly within a complex public-sector organisation and have been accountable for delivering transformation from the inside. Consulting experience can certainly be relevant, but this assignment requires someone who understands the practical realities of organisational transformation: working alongside operational services, navigating organisational constraints, making difficult design decisions and taking those decisions through into implementation.\";\n\nconst SUPPORT_ALTS = [\n  { name: \"Technical Support Engineer / Systems Administrator\", family: \"Customer and Client Support · Technical Support\", score: 55,\n    keeps: \"Team leadership, SLA ownership, ticketing stack\", drops: \"SaaS API troubleshooting, product-defect partnership\",\n    effect: \"Costs 8% less\", effectNote: \"$96K median · wider supply\", tone: \"down\" },\n  { name: \"Project Manager (General)\", family: \"Computer Support Specialist\", score: 80,\n    keeps: \"SaaS, API and SQL troubleshooting, escalations\", drops: \"People management, shift scheduling\",\n    effect: \"Costs 24% less\", effectNote: \"$79K median · widest supply\", tone: \"down\" },\n  { name: \"Operations Project Manager\", family: \"Computer Support Specialist\", score: 75,\n    keeps: \"Incident and problem management, ITIL, reporting\", drops: \"Customer-facing support ownership\",\n    effect: \"Costs 19% more\", effectNote: \"$124K median · thinner supply\", tone: \"up\" },\n  { name: \"Systems Administrator\", family: \"Network / Systems Administrator\", score: 68,\n    keeps: \"Enterprise customer comms, CSAT ownership\", drops: \"Hands-on troubleshooting, incident command\",\n    effect: \"Costs 6% more\", effectNote: \"$110K median · balanced supply\", tone: \"up\" },\n];\n\nconst SUPPORT_LAND = {\n  summary: \"A Technical Support Manager leads the tier 2 and tier 3 support function for a software product — owning escalation handling, response and resolution targets, and the people who deliver them. Accountable for customer outcomes, support quality and the feedback loop into engineering and product.\",\n  topSkills: [\"Technical Support\", \"Incident Management\", \"ITIL\", \"Customer Service\", \"Team Leadership\", \"Zendesk\", \"Jira Service Management\", \"SQL (Programming Language)\", \"API Troubleshooting\", \"Knowledge Management\"],\n  keySkills: [\"Escalation ownership\", \"SLA and CSAT management\", \"Coaching and shift planning\", \"Root-cause review\", \"Runbook and knowledge base build\", \"Support tooling administration\", \"Cross-team defect triage\", \"Customer communication\"],\n  responsibilities: [\n    \"Lead, coach and schedule a multi-shift team of support engineers\",\n    \"Own incident escalation, root-cause reviews and customer communication\", \" + rate(hourly * 1.6), 41], [\"Above \" + rate(hourly * 1.6), 13]].map(([label, pct]) => ({\n              label, pct: pct + \"%\",\n              barStyle: \"display:block;height:100%;border-radius:4px;width:\" + pct + \"%;background-color:rgb(239,121,38);\",\n            }))\n          : [],\n      },\n      costDist: this.costDistVals(),\n    };\n  }\n\n  costDistVals() {\n    const rows = [\n      { title: \"Project/Program Manager IV\", starts: 42, min: 91.48, median: 98.62, max: 105.75 },\n      { title: \"Project/Program Manager II\", starts: 14, min: 66.60, median: 70.25, max: 73.89 },\n      { title: \"Program Manager V\", starts: 13, min: 112.01, median: 123.41, max: 134.80 },\n      { title: \"Program Manager III\", starts: 13, min: 80.40, median: 86.13, max: 91.86 },\n      { title: \"Program Manager II\", starts: 12, min: 64.14, median: 69.76, max: 75.38 },\n    ];\n    const cur = this.locSet().cur;\n    const fmt = (v) => cur + v.toFixed(2);\n    const programStarts = 187;\n    const lower = 58.54, median = 79.28, higher = 134.80;\n    const sigma = (higher - lower) / 4;\n    const domainMin = 20, domainMax = 170;\n    const gauss = (x) => Math.exp(-0.5 * Math.pow((x - median) / sigma, 2));\n    const N = 60;\n    const peak = gauss(median);\n    const X = (v) => ((v - domainMin) / (domainMax - domainMin)) * 100;\n    const Y = (d) => 92 - (d / peak) * 80;\n    const pts = [];\n    for (let i = 0; i <= N; i++) {\n      const x = domainMin + (i / N) * (domainMax - domainMin);\n      pts.push([X(x), Y(gauss(x))]);\n    }\n    const path = \"M\" + pts.map((p, i) => (i ? \"L\" : \"\") + p[0].toFixed(2) + \",\" + p[1].toFixed(2)).join(\" \");\n    const area = path + \" L100,100 L0,100 Z\";\n\n    const markerLine = (v) => \"position:absolute;left:\" + X(v).toFixed(2) + \"%;top:6%;bottom:0;width:0;border-left:1.5px dashed rgb(163,186,222);pointer-events:none;\";\n    const markerDot = (v) => \"position:absolute;left:\" + X(v).toFixed(2) + \"%;top:\" + Y(gauss(v)).toFixed(2) + \"%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background-color:rgb(74,131,224);box-shadow:0 0 0 3px rgba(74,131,224,0.18);pointer-events:none;\";\n    const sideBadge = (v) => \"position:absolute;left:\" + X(v).toFixed(2) + \"%;top:30%;transform:translate(-50%,-100%);border-radius:10px;background-color:rgb(243,246,249);display:flex;flex-direction:column;gap:1px;padding:7px 11px;pointer-events:none;white-space:nowrap;\";\n    const medianBadge = \"position:absolute;left:\" + X(median).toFixed(2) + \"%;top:0%;transform:translate(-50%,0);border-radius:10px;background-color:rgb(2,26,50);display:flex;flex-direction:column;gap:1px;padding:8px 13px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 18px rgba(2,26,50,0.22);\";\n\n    const hov = this.state.billHover;\n    const hovOn = hov != null;\n    const hovVal = hovOn ? domainMin + (hov / N) * (domainMax - domainMin) : 0;\n    const hovClamp = hov <= 3 ? \"translate(-4%,calc(-100% - 14px))\" : hov >= N - 3 ? \"translate(-96%,calc(-100% - 14px))\" : \"translate(-50%,calc(-100% - 14px))\";\n\n    return {\n      programStarts: String(programStarts),\n      path, area,\n      lowerLineStyle: markerLine(lower), medianLineStyle: markerLine(median), higherLineStyle: markerLine(higher),\n      lowerDotStyle: markerDot(lower), medianDotStyle: markerDot(median), higherDotStyle: markerDot(higher),\n      lowerBadgeStyle: sideBadge(lower), higherBadgeStyle: sideBadge(higher), medianBadgeStyle: medianBadge,\n      lowerLabel: fmt(lower), higherLabel: fmt(higher), medianLabel: fmt(median),\n      axisTicks: [0, 0.2, 0.4, 0.6, 0.8, 1].map((f) => cur + Math.round(domainMin + f * (domainMax - domainMin))),\n      guideStyle: hovOn ? \"position:absolute;left:\" + X(hovVal).toFixed(2) + \"%;top:6%;bottom:0;width:1px;background-color:rgba(2,26,50,0.14);pointer-events:none;\" : \"display:none;\",\n      hovDotStyle: hovOn ? \"position:absolute;left:\" + X(hovVal).toFixed(2) + \"%;top:\" + Y(gauss(hovVal)).toFixed(2) + \"%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background-color:rgb(2,26,50);pointer-events:none;\" : \"display:none;\",\n      tipStyle: hovOn\n        ? \"position:absolute;left:\" + X(hovVal).toFixed(2) + \"%;top:\" + Y(gauss(hovVal)).toFixed(2) + \"%;transform:\" + hovClamp + \";border-radius:10px;background-color:rgb(2,26,50);box-shadow:0 12px 26px rgba(2,26,50,0.22);display:flex;flex-direction:column;gap:3px;padding:9px 12px;pointer-events:none;z-index:2;\"\n        : \"display:none;\",\n      tipValue: fmt(hovVal),\n      tipFreq: \"Relative frequency \" + Math.round((gauss(hovVal) / peak) * 100) + \"%\",\n      onLeave: () => this.setState({ billHover: null }),\n      zones: Array.from({ length: N + 1 }, (_, i) => ({\n        onEnter: () => this.setState({ billHover: i }),\n        zoneStyle: \"flex:1;min-width:0;height:100%;cursor:crosshair;\",\n      })),\n      rows: rows.map((r) => ({ title: r.title, starts: String(r.starts), min: fmt(r.min), median: fmt(r.median), max: fmt(r.max) })),\n    };\n  }\n\n  openLocation(m) {\n    this.setState({ openMsa: m.name, compareOpen: false });\n    this.startRead();\n  }\n\n  cardStyle(active, accent) {\n    const line = active ? accent.line : \"rgb(238,242,246)\";\n    return \"border-radius:22px;background-color:rgb(255,255,255);padding:30px 30px 26px 30px;cursor:pointer;display:flex;flex-direction:column;gap:18px;min-height:100%;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease;\" +\n      (active\n        ? \"transform:translateY(-4px);box-shadow:inset 0 0 0 1.5px \" + line + \",0 22px 44px rgba(2,26,50,0.13);\"\n        : \"box-shadow:inset 0 0 0 1px \" + line + \",0 8px 24px rgba(2,26,50,0.07);\");\n  }\n\n  iconStyle(active, bg, fg) {\n    return \"width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s ease;background-color:\" + bg + \";color:\" + fg + \";\" + (active ? \"transform:scale(1.06);\" : \"\");\n  }\n\n  arrowStyle(active, solid) {\n    return \"width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .2s ease,color .2s ease;\" +\n      (active ? \"background-color:\" + solid + \";color:rgb(255,255,255);transform:translateX(3px);\" : \"background-color:rgb(244,247,250);color:rgb(146,160,174);\");\n  }\n\n  renderVals() {\n    const s = this.state;\n    const q = s.query.trim().toLowerCase();\n    const filtered = ROLES.filter((x) => {\n      const okFam = s.family === \"All\" || x.family.toLowerCase().indexOf(s.family.toLowerCase()) === 0;\n      const okQ = !q || (x.name + \" \" + x.family).toLowerCase().includes(q);\n      return okFam && okQ;\n    });\n    const jobHover = s.hover === \"job\";\n    const browseHover = s.hover === \"browse\";\n\n    return {\n      ...this.flowVals(),\n      ...this.pageOne(),\n      ...this.pageTwo(),\n      steps: (() => {\n        const sc = this.state.screen;\n        const stage = sc === \"market\" ? 2 : sc === \"landscape\" ? 1 : (sc === \"match\" && this.state.picked) ? 1 : 0;\n        const roleMeta = sc === \"landing\" ? \"Start here\"\n          : sc === \"jd\" ? \"Reading your description\"\n          : (this.state.picked ? this.state.picked.name\n            : (/programme|transformation|service redesign|support|help ?desk|service desk|escalation|csat|itil|ticket/i.test(this.state.jd.trim() || SAMPLE_JD) ? \"Program Manager (General)\" : \"Data Engineers\"));\n        return [\n          [\"Select an occupation\", roleMeta],\n          [\"Choose a location\", sc === \"market\" ? this.state.openMsa.split(\" – \")[0] : \"Select one or compare multiple\"],\n          [\"View Market Intelligence\", sc === \"market\" ? \"Supply, demand and pay\" : \"Not yet opened\"],\n        ].map(([title, meta], i) => {\n          const done = i < stage, active = i === stage;\n          return {\n            num: done ? \"✓\" : String(i + 1),\n            title, meta,\n            wrapStyle: \"flex:1;min-width:0;display:flex;flex-direction:row;gap:12px;align-items:center;padding:15px 18px;\" + (i ? \"border-left:1px solid rgb(238,242,246);\" : \"\") + (done || active ? \"\" : \"opacity:.62;\"),\n            numStyle: \"width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;transition:background-color .2s ease,color .2s ease;\" +\n              (active ? \"background-color:rgb(239,121,38);color:rgb(255,255,255);box-shadow:0 0 0 4px rgba(239,121,38,0.16);\"\n                : done ? \"background-color:rgb(2,26,50);color:rgb(255,255,255);\"\n                : \"background-color:rgb(240,244,249);color:rgb(122,138,154);\"),\n            titleStyle: \"font-weight:600;font-size:13.5px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:\" + (done || active ? \"rgb(2,26,50)\" : \"rgb(90,107,124)\") + \";\",\n          };\n        });\n      })(),\n\n      pickJob: () => { if (this.props.onLoadJob) this.props.onLoadJob(); this.nav(\"jd\", { picked: null }); },\n      pickBrowse: () => { if (this.props.onBrowse) this.props.onBrowse(); this.setState({ catalogOpen: true, countryOpen: false }); },\n      hoverJob: () => this.setState({ hover: \"job\" }),\n      hoverBrowse: () => this.setState({ hover: \"browse\" }),\n      hoverNone: () => this.setState({ hover: \"\" }),\n\n      jobCardStyle: this.cardStyle(jobHover, { line: \"rgba(239,121,38,0.55)\" }),\n      browseCardStyle: this.cardStyle(browseHover, { line: \"rgba(74,131,224,0.55)\" }),\n      jobIconStyle: this.iconStyle(jobHover, \"rgba(239,121,38,0.11)\", \"rgb(198,92,16)\"),\n      browseIconStyle: this.iconStyle(browseHover, \"rgba(74,131,224,0.11)\", \"rgb(35,88,166)\"),\n      jobArrowStyle: this.arrowStyle(jobHover, \"rgb(239,121,38)\"),\n      browseArrowStyle: this.arrowStyle(browseHover, \"rgb(35,88,166)\"),\n      jobBtnStyle: \"pointer-events:none;height:42px;border-radius:12px;display:inline-flex;align-items:center;gap:9px;padding:0 20px;font-weight:600;font-size:13.5px;white-space:nowrap;color:rgb(255,255,255);flex-shrink:0;transition:background-color .18s ease,box-shadow .18s ease,transform .18s ease;background-color:\" +\n        (jobHover ? \"rgb(226,109,28)\" : \"rgb(239,121,38)\") + \";box-shadow:0 \" + (jobHover ? \"10px 22px\" : \"4px 12px\") + \" rgba(239,121,38,0.28);\" + (jobHover ? \"transform:translateY(-1px);\" : \"\"),\n      browseBtnStyle: \"pointer-events:none;height:42px;border-radius:12px;display:inline-flex;align-items:center;gap:9px;padding:0 20px;font-weight:600;font-size:13.5px;white-space:nowrap;flex-shrink:0;transition:box-shadow .18s ease,background-color .18s ease,transform .18s ease;color:rgb(2,26,50);background-color:\" +\n        (browseHover ? \"rgb(248,251,255)\" : \"rgb(255,255,255)\") + \";box-shadow:inset 0 0 0 1px \" + (browseHover ? \"rgba(35,88,166,0.55)\" : \"rgb(226,232,240)\") + \";\" + (browseHover ? \"transform:translateY(-1px);\" : \"\"),\n\n      previewRoles: ROLES.slice(0, 3).map((r, i) => ({\n        name: r.name,\n        family: r.family.split(\"·\")[0].trim(),\n        rowStyle: \"display:flex;flex-direction:row;gap:12px;justify-content:space-between;align-items:center;padding:8px 9px;border-radius:8px;min-width:0;transition:background-color .18s ease;\" + (i === 0 && browseHover ? \"background-color:rgba(74,131,224,0.07);\" : \"\"),\n      })),\n\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      resultLine: filtered.length === ROLES.length ? \"Most viewed this week\" : filtered.length + \" of \" + ROLES.length + \" occupations\",\n      families: FAMILIES.map((f) => ({\n        label: f,\n        onClick: () => this.setState({ family: f }),\n        style: \"border-radius:999px;padding:6px 13px;cursor:pointer;font-weight
